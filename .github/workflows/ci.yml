name: Host checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install toolkit and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run host tests
        run: python -m pytest -q
      - name: Reproduce all three lighting stations offline
        run: |
          python examples/lighting-case-study/generate.py --out "$RUNNER_TEMP/lighting-case-study"
          python -c "import hashlib, os; from pathlib import Path; root = Path(os.environ['RUNNER_TEMP']) / 'lighting-case-study'; expected = '499f966aef619067b1ce6aaed78ee74eb392bc519d92442119c67d7f5429a38c'; assert all(len((root / (station + '.bin')).read_bytes()) == 5954 and hashlib.sha256((root / (station + '.bin')).read_bytes()).hexdigest() == expected for station in ('PLC1', 'PLC2', 'PLC3'))"
      - name: Scan public source and commit metadata
        run: python scripts/check_public.py --allow-missing-private
      - name: Scan historical file versions reachable in this checkout
        run: python scripts/check_history.py --allow-missing-private
